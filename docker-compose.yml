services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: northstar-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "NorthstarSql!2026Strong"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - northstar_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'NorthstarSql!2026Strong' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: northstar-hr-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=HrManagementSystemDb;User Id=sa;Password=NorthstarSql!2026Strong;TrustServerCertificate=True;MultipleActiveResultSets=true"
      JwtSettings__Key: "NorthstarLocalDevelopmentKey_ChangeBeforeProduction_2026"
      JwtSettings__Issuer: "HrManagementSystem"
      JwtSettings__Audience: "HrManagmentSystemClients"
      Hangfire__Enabled: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./HrManagmentSystem_API/Uploads:/app/Uploads
      - ./HrManagmentSystem_API/Logs:/app/Logs

volumes:
  northstar_sql_data:
